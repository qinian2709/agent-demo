<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Agent 对话测试台</title>
<style>
  :root {
    --bg: #0f0f11;
    --bg-card: #1a1a1f;
    --bg-input: #25252b;
    --bg-user: #2a2a35;
    --bg-agent: #1e1e26;
    --fg: #e4e4e7;
    --fg-muted: #71717a;
    --fg-dim: #52525b;
    --border: #2e2e36;
    --accent: #6366f1;
    --accent-hover: #818cf8;
    --green: #22c55e;
    --red: #ef4444;
    --orange: #f59e0b;
    --radius: 12px;
    --radius-sm: 8px;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f8f9fa;
      --bg-card: #ffffff;
      --bg-input: #f1f1f4;
      --bg-user: #e8e8f0;
      --bg-agent: #ffffff;
      --fg: #1a1a2e;
      --fg-muted: #71717a;
      --fg-dim: #a1a1aa;
      --border: #e4e4e7;
      --accent: #4f46e5;
      --accent-hover: #4338ca;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f0f11;
    --bg-card: #1a1a1f;
    --bg-input: #25252b;
    --bg-user: #2a2a35;
    --bg-agent: #1e1e26;
    --fg: #e4e4e7;
    --fg-muted: #71717a;
    --fg-dim: #52525b;
    --border: #2e2e36;
    --accent: #6366f1;
    --accent-hover: #818cf8;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--fg);
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: 0 max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
  }
  .header {
    padding: 16px 0;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .header h1 {
    font-size: 18px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .header h1 .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--green);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
  .header-actions {
    display: flex;
    gap: 8px;
  }
  .header-btn {
    background: var(--bg-input);
    border: 1px solid var(--border);
    color: var(--fg-muted);
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .header-btn:hover {
    background: var(--border);
    color: var(--fg);
  }
  .chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 20px 0;
    display: flex;
    flex-direction: column;
    gap: 16px;
    min-height: 0;
  }
  .chat-area::-webkit-scrollbar { width: 6px; }
  .chat-area::-webkit-scrollbar-track { background: transparent; }
  .chat-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .message {
    display: flex;
    gap: 12px;
    max-width: 85%;
    animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .message.user {
    align-self: flex-end;
    flex-direction: row-reverse;
  }
  .message.agent {
    align-self: flex-start;
  }
  .avatar {
    width: 36px; height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
  }
  .message.user .avatar { background: var(--accent); }
  .message.agent .avatar { background: var(--bg-input); border: 1px solid var(--border); }
  .bubble {
    padding: 12px 16px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.6;
    word-break: break-word;
  }
  .message.user .bubble {
    background: var(--accent);
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .message.agent .bubble {
    background: var(--bg-agent);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }
  .bubble pre {
    background: var(--bg-input);
    padding: 12px;
    border-radius: var(--radius-sm);
    overflow-x: auto;
    margin: 8px 0;
    font-size: 13px;
    line-height: 1.5;
  }
  .bubble code {
    font-family: 'JetBrains Mono', 'Fira Code', monospace;
    font-size: 13px;
  }
  .tool-call {
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    margin: 8px 0;
    font-size: 13px;
  }
  .tool-call-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
  }
  .tool-call-icon {
    width: 20px; height: 20px;
    border-radius: 4px;
    background: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    color: #fff;
  }
  .tool-call-name {
    font-weight: 600;
    color: var(--accent);
  }
  .tool-call-status {
    margin-left: auto;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 10px;
  }
  .tool-call-status.ok { background: rgba(34,197,94,0.15); color: var(--green); }
  .tool-call-status.error { background: rgba(239,68,68,0.15); color: var(--red); }
  .tool-call-status.pending { background: rgba(245,158,11,0.15); color: var(--orange); }
  .tool-call-detail {
    color: var(--fg-muted);
    font-size: 12px;
    margin-top: 4px;
  }
  .tool-call-detail span {
    color: var(--fg);
  }
  .typing {
    display: flex;
    gap: 4px;
    padding: 4px 0;
  }
  .typing span {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--fg-dim);
    animation: bounce 1.4s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); }
    30% { transform: translateY(-6px); }
  }
  .input-area {
    flex-shrink: 0;
    padding: 12px 0;
    border-top: 1px solid var(--border);
  }
  .input-wrapper {
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }
  .input-wrapper textarea {
    flex: 1;
    background: var(--bg-input);
    border: 1px solid var(--border);
    color: var(--fg);
    padding: 12px 16px;
    border-radius: 24px;
    font-size: 14px;
    font-family: inherit;
    resize: none;
    outline: none;
    max-height: 120px;
    line-height: 1.5;
    transition: border-color 0.2s;
  }
  .input-wrapper textarea:focus {
    border-color: var(--accent);
  }
  .send-btn {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: var(--accent);
    border: none;
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    flex-shrink: 0;
  }
  .send-btn:hover { background: var(--accent-hover); transform: scale(1.05); }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  .welcome {
    text-align: center;
    padding: 40px 20px;
    color: var(--fg-muted);
  }
  .welcome h2 {
    font-size: 22px;
    color: var(--fg);
    margin-bottom: 8px;
  }
  .welcome p { font-size: 14px; margin-bottom: 24px; }
  .suggestions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
  }
  .suggestion {
    background: var(--bg-card);
    border: 1px solid var(--border);
    padding: 10px 16px;
    border-radius: 20px;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
    color: var(--fg);
  }
  .suggestion:hover {
    border-color: var(--accent);
    background: var(--bg-input);
  }
  @media (max-width: 640px) {
    .message { max-width: 95%; }
    .suggestions { flex-direction: column; align-items: center; }
  }
</style>
</head>
<body>

<div class="header">
  <h1><span class="dot"></span> Agent 对话测试台</h1>
  <div class="header-actions">
    <a class="header-btn" href="/eval.html" style="text-decoration:none">🧪 测试评测</a>
    <button class="header-btn" onclick="clearChat()">🗑️ 清空</button>
  </div>
</div>

<div class="chat-area" id="chatArea">
  <div class="welcome" id="welcome">
    <h2>🤖 Agent & MCP 对话测试台</h2>
    <p>测试普通 Tool 与 MCP 协议（方案1 第三方现成 MCP vs 方案2 自研全链路透传 MCP）在 Phoenix 上的 Trace 表现</p>
    <div class="suggestions">
      <div class="suggestion" onclick="sendSuggestion(this)">[方案1-第三方现成MCP] 调用 Phoenix 官方 MCP 检索 trace 相关工具</div>
      <div class="suggestion" onclick="sendSuggestion(this)">[方案2-自研MCP全链路透传] 核查订单 ORD-20261103 的数据库与排课状态</div>
      <div class="suggestion" onclick="sendSuggestion(this)">[MCP异常标红测试] 核查异常订单 ORD-ERROR 的状态</div>
      <div class="suggestion" onclick="sendSuggestion(this)">北京今天天气怎么样</div>
      <div class="suggestion" onclick="sendSuggestion(this)">计算 123 × 456 等于多少</div>
    </div>
  </div>
</div>

<div class="input-area">
  <div class="input-wrapper">
    <textarea id="inputBox" rows="1" placeholder="输入你的问题..." onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
    <button class="send-btn" id="sendBtn" onclick="sendMessage()">↑</button>
  </div>
</div>

<script>
const chatArea = document.getElementById('chatArea');
const inputBox = document.getElementById('inputBox');
const sendBtn = document.getElementById('sendBtn');
const welcome = document.getElementById('welcome');
let isProcessing = false;
let phoenixBaseUrl = 'https://agent-phoenix.coolify.eeo-inc.com';

fetch('/api/health')
  .then(r => r.json())
  .then(d => { if (d && d.phoenix_url) phoenixBaseUrl = d.phoenix_url; })
  .catch(() => {});

function openPhoenix() {
  window.open(phoenixBaseUrl, '_blank');
}

function clearChat() {
  chatArea.innerHTML = '';
  chatArea.appendChild(createWelcome());
}

function createWelcome() {
  const div = document.createElement('div');
  div.className = 'welcome';
  div.id = 'welcome';
  div.innerHTML = `
    <h2>🤖 Agent & MCP 对话测试台</h2>
    <p>测试普通 Tool 与 MCP 协议（方案1 第三方现成 MCP vs 方案2 自研全链路透传 MCP）在 Phoenix 上的 Trace 表现</p>
    <div class="suggestions">
      <div class="suggestion" onclick="sendSuggestion(this)">[方案1-第三方现成MCP] 调用 Phoenix 官方 MCP 检索 trace 相关工具</div>
      <div class="suggestion" onclick="sendSuggestion(this)">[方案2-自研MCP全链路透传] 核查订单 ORD-20261103 的数据库与排课状态</div>
      <div class="suggestion" onclick="sendSuggestion(this)">[MCP异常标红测试] 核查异常订单 ORD-ERROR 的状态</div>
      <div class="suggestion" onclick="sendSuggestion(this)">北京今天天气怎么样</div>
      <div class="suggestion" onclick="sendSuggestion(this)">计算 123 × 456 等于多少</div>
    </div>
  `;
  return div;
}

function sendSuggestion(el) {
  inputBox.value = el.textContent;
  sendMessage();
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function addMessage(role, content, toolCalls) {
  if (welcome) welcome.remove();
  const msg = document.createElement('div');
  msg.className = 'message ' + role;

  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = role === 'user' ? '👤' : '🤖';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';

  if (content) {
    bubble.innerHTML = formatContent(content);
  }

  if (toolCalls && toolCalls.length > 0) {
    toolCalls.forEach(tc => {
      const tcDiv = document.createElement('div');
      tcDiv.className = 'tool-call';
      tcDiv.innerHTML = `
        <div class="tool-call-header">
          <div class="tool-call-icon">🔧</div>
          <span class="tool-call-name">${tc.name}</span>
          <span class="tool-call-status ${tc.status || 'pending'}">${tc.status === 'error' ? '❌ 错误' : tc.status === 'ok' ? '✅ 成功' : '⏳ 调用中...'}</span>
        </div>
        <div class="tool-call-detail">参数：${tc.args || '—'}</div>
        ${tc.result ? `<div class="tool-call-detail">结果：${tc.result}</div>` : ''}
        ${tc.latency_ms ? `<div class="tool-call-detail">耗时：${tc.latency_ms}ms</div>` : ''}
      `;
      bubble.appendChild(tcDiv);
    });
  }

  msg.appendChild(avatar);
  msg.appendChild(bubble);
  chatArea.appendChild(msg);
  chatArea.scrollTop = chatArea.scrollHeight;
  return bubble;
}

function addTyping() {
  if (welcome) welcome.remove();
  const msg = document.createElement('div');
  msg.className = 'message agent';
  msg.id = 'typingMsg';
  msg.innerHTML = `
    <div class="avatar">🤖</div>
    <div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>
  `;
  chatArea.appendChild(msg);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function removeTyping() {
  const t = document.getElementById('typingMsg');
  if (t) t.remove();
}

function formatContent(text) {
  text = text.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
  text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
  text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  text = text.replace(/\n/g, '<br>');
  return text;
}

async function sendMessage() {
  const text = inputBox.value.trim();
  if (!text || isProcessing) return;

  isProcessing = true;
  sendBtn.disabled = true;
  inputBox.value = '';
  inputBox.style.height = 'auto';

  addMessage('user', text);
  addTyping();

  const apiUrl = '/api/chat';
  const startTime = Date.now();

  try {
    const resp = await fetch(apiUrl, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({
        message: text,
      }),
    });

    const latency = Date.now() - startTime;
    // 无论 JSON 还是纯文本报错都能安全解析，避免 Unexpected token is not valid JSON
    const rawText = await resp.text();
    let data = {};
    try {
      data = rawText ? JSON.parse(rawText) : {};
    } catch {
      data = { error: rawText };
    }

    removeTyping();

    if (!resp.ok) {
      addMessage('agent', `❌ API 错误：${data.error || resp.status}`);
      return;
    }

    const reply = data.reply || '(无回复)';
    const toolCalls = data.tool_calls || [];
    const traceID = data.trace_id || '';
    if (data.phoenix_url) phoenixBaseUrl = data.phoenix_url;

    addMessage('agent', reply, toolCalls.length > 0 ? toolCalls : undefined);

    const lastMsg = chatArea.lastElementChild;
    if (lastMsg) {
      const info = document.createElement('div');
      info.style.cssText = 'font-size:11px;color:var(--fg-dim);margin-top:4px;padding:0 16px;';
      let infoText = `⏱ ${latency}ms`;
      if (traceID) {
        infoText += ` · TraceID: <code>${traceID}</code> · <a href="${phoenixBaseUrl}" target="_blank" style="color:var(--accent);text-decoration:none;">🔍 打开 Phoenix 查看调用链</a>`;
      }
      info.innerHTML = infoText;
      lastMsg.appendChild(info);
    }

  } catch (err) {
    removeTyping();
    addMessage('agent', `❌ 请求失败：${err.message}\n\n请检查:\n1. agent-demo HTTP 服务是否运行 (端口 9000)\n2. 运行命令：cd agent-demo && ENABLE_TRACING=true go run http_server.go`);
  }

  isProcessing = false;
  sendBtn.disabled = false;
  inputBox.focus();
}

inputBox.focus();
</script>
</body>
</html>
