<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agent 测试评测台</title>
<style>
  :root {
    --bg: #0f0f11;
    --bg-card: #1a1a1f;
    --bg-input: #25252b;
    --fg: #e4e4e7;
    --fg-muted: #71717a;
    --border: #2e2e36;
    --accent: #6366f1;
    --green: #22c55e;
    --red: #ef4444;
    --orange: #f59e0b;
    --blue: #38bdf8;
    --radius: 12px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--fg);
    min-height: 100vh;
    padding: 0 20px 32px;
  }
  .header {
    padding: 16px 0;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .header h1 {
    font-size: 18px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .header h1 .dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--green);
  }
  .header-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn {
    background: var(--bg-input);
    border: 1px solid var(--border);
    color: var(--fg);
    padding: 8px 14px;
    border-radius: 20px;
    font-size: 13px;
    cursor: pointer;
  }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .sub {
    color: var(--fg-muted);
    font-size: 13px;
    padding: 12px 0 16px;
    max-width: 820px;
    line-height: 1.5;
  }
  .tools { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .chip {
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 999px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--blue);
  }
  .controls {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .focus {
    flex: 1;
    min-width: 220px;
    background: var(--bg-input);
    border: 1px solid var(--border);
    color: var(--fg);
    border-radius: 10px;
    padding: 9px 12px;
    font-size: 13px;
  }
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 10px;
    margin-bottom: 16px;
  }
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
  }
  .card .label { font-size: 12px; color: var(--fg-muted); }
  .card .value { font-size: 24px; font-weight: 700; margin-top: 4px; }
  .pass { color: var(--green); }
  .fail { color: var(--red); }
  .partial { color: var(--orange); }
  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    font-size: 13px;
  }
  th, td {
    text-align: left;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
  }
  th { color: var(--fg-muted); font-weight: 600; font-size: 12px; }
  tr:last-child td { border-bottom: none; }
  tr.expandable { cursor: pointer; }
  tr.expandable:hover td { background: #22222a; }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
  }
  .badge.Pass { background: rgba(34,197,94,.15); color: var(--green); }
  .badge.Partial { background: rgba(245,158,11,.15); color: var(--orange); }
  .badge.Fail { background: rgba(239,68,68,.15); color: var(--red); }
  .badge.Blocked { background: rgba(113,113,122,.2); color: var(--fg-muted); }
  .badge.pending { background: var(--bg-input); color: var(--fg-muted); }
  .detail {
    white-space: pre-wrap;
    color: var(--fg-muted);
    font-size: 12px;
    line-height: 1.5;
  }
  .status { font-size: 13px; color: var(--fg-muted); }
</style>
</head>
<body>
<div class="header">
  <h1><span class="dot"></span> Agent 测试评测台</h1>
  <div class="header-actions">
    <a class="btn" href="/chat.html">对话沙箱</a>
    <button class="btn" id="btnGen" onclick="generateCases()">生成测试用例</button>
    <button class="btn primary" id="btnRun" onclick="runEval()">执行评测</button>
  </div>
</div>
<p class="sub">根据当前 Agent 已注册的工具（含 MCP）自动生成测试用例，真实调用 Agent，断言工具路由、关键词、拒绝策略和耗时。这是效果评测，不是日志追踪。</p>
<div class="tools" id="tools"></div>
<div class="controls">
  <input class="focus" id="focus" placeholder="可选：补充生成要求，例如「多加订单异常和安全拒绝」">
  <label class="status"><input type="checkbox" id="useLlm" checked> 用 LLM 补边界用例</label>
  <span class="status" id="status">尚未生成用例</span>
</div>
<div class="cards" id="cards" hidden>
  <div class="card"><div class="label">总数</div><div class="value" id="cTotal">0</div></div>
  <div class="card"><div class="label">通过</div><div class="value pass" id="cPass">0</div></div>
  <div class="card"><div class="label">部分通过</div><div class="value partial" id="cPartial">0</div></div>
  <div class="card"><div class="label">失败</div><div class="value fail" id="cFail">0</div></div>
  <div class="card"><div class="label">通过率</div><div class="value" id="cRate">—</div></div>
</div>
<table>
  <thead>
    <tr>
      <th>ID</th>
      <th>分类</th>
      <th>输入</th>
      <th>期望工具</th>
      <th>延迟上限</th>
      <th>结果</th>
    </tr>
  </thead>
  <tbody id="tbody">
    <tr><td colspan="6" class="status">点击「生成测试用例」开始</td></tr>
  </tbody>
</table>

<script>
let cases = [];
const resultsById = {};

async function loadTools() {
  const res = await fetch('/api/tools');
  const data = await res.json();
  const box = document.getElementById('tools');
  box.innerHTML = (data.tools || []).map(t =>
    `<span class="chip" title="${esc(t.description || '')}">${esc(t.name)}</span>`
  ).join('') || '<span class="status">未发现工具</span>';
}

function renderCases() {
  const tbody = document.getElementById('tbody');
  if (!cases.length) {
    tbody.innerHTML = '<tr><td colspan="6" class="status">暂无用例</td></tr>';
    return;
  }
  tbody.innerHTML = cases.map(c => {
    const r = resultsById[c.id];
    const verdict = r ? r.verdict : 'pending';
    const label = r ? r.verdict : '待执行';
    const tools = (c.expected_tools && c.expected_tools.length) ? c.expected_tools.join(', ') : (c.tool_policy === 'forbidden' ? '禁止调用' : '—');
    const extra = r ? renderDetail(r) : '';
    return `<tr class="expandable" onclick="toggleDetail('${escAttr(c.id)}')">
      <td>${esc(c.id)}</td>
      <td>${esc(c.category || '')}</td>
      <td>${esc(c.input || '')}</td>
      <td>${esc(tools)}</td>
      <td>${c.max_latency || 15}s</td>
      <td><span class="badge ${verdict}">${label}</span></td>
    </tr>
    <tr id="d-${escAttr(c.id)}" hidden><td colspan="6" class="detail">${extra || '执行后显示证据'}</td></tr>`;
  }).join('');
}

function renderDetail(r) {
  const obs = r.observation || {};
  const tools = (obs.tool_calls || []).map(t => `${t.name} (${t.status})`).join(', ') || '无';
  const reasons = (r.reasons || []).join('\n');
  return `实际工具：${esc(tools)}
耗时：${obs.latency_ms || 0}ms
判定：${esc(reasons)}
回复：${esc((obs.reply || '').slice(0, 800))}`;
}

function setStatus(text) {
  document.getElementById('status').textContent = text;
}

async function generateCases() {
  const btn = document.getElementById('btnGen');
  btn.disabled = true;
  setStatus('正在根据工具清单生成用例…');
  try {
    const res = await fetch('/api/eval/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        use_llm: document.getElementById('useLlm').checked,
        focus: document.getElementById('focus').value.trim(),
      }),
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    cases = data.cases || [];
    Object.keys(resultsById).forEach(k => delete resultsById[k]);
    renderCases();
    setStatus(`已生成 ${cases.length} 条用例（${data.source}）`);
  } catch (e) {
    setStatus('生成失败：' + e.message);
  } finally {
    btn.disabled = false;
  }
}

async function runEval() {
  if (!cases.length) {
    await generateCases();
  }
  if (!cases.length) return;
  const btn = document.getElementById('btnRun');
  btn.disabled = true;
  document.getElementById('cards').hidden = false;
  setStatus('正在执行评测…');
  try {
    const res = await fetch('/api/eval/run?stream=1', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'text/event-stream' },
      body: JSON.stringify({ cases }),
    });
    if (!res.ok || !res.body) throw new Error('评测接口失败');
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const parts = buf.split('\n\n');
      buf = parts.pop();
      for (const block of parts) applySSE(block);
    }
    if (buf.trim()) applySSE(buf);
    setStatus('评测完成');
  } catch (e) {
    setStatus('执行失败：' + e.message);
  } finally {
    btn.disabled = false;
  }
}

function applySSE(block) {
  let event = 'message';
  let data = '';
  for (const line of block.split('\n')) {
    if (line.startsWith('event:')) event = line.slice(6).trim();
    if (line.startsWith('data:')) data += line.slice(5).trim();
  }
  if (!data) return;
  const payload = JSON.parse(data);
  if (event === 'case') {
    resultsById[payload.case.id] = payload;
    renderCases();
  }
  if (event === 'done' && payload.summary) {
    const s = payload.summary;
    document.getElementById('cTotal').textContent = s.total;
    document.getElementById('cPass').textContent = s.pass;
    document.getElementById('cPartial').textContent = s.partial;
    document.getElementById('cFail').textContent = s.fail;
    document.getElementById('cRate').textContent = Math.round((s.pass_rate || 0) * 100) + '%';
  }
}

function toggleDetail(id) {
  const row = document.getElementById('d-' + id);
  if (row) row.hidden = !row.hidden;
}

function esc(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escAttr(s) { return esc(s).replace(/`/g, ''); }

loadTools().catch(() => setStatus('无法读取工具清单'));
</script>
</body>
</html>
